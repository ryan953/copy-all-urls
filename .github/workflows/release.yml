# Cuts a GitHub Release with the packaged extension attached, and (when Chrome
# Web Store credentials are configured) publishes the same zip to the Web Store.
#
# Trigger by pushing a version tag (e.g. `git tag v3.0.0 && git push origin v3.0.0`),
# or run manually via the Actions tab against an existing tag.
#
# The tag version must match `version` in manifest.json (a guard step enforces this),
# so the tag, the manifest, and the artifact name always agree.
#
# The GitHub release is created as a *draft*, the zip is uploaded, then it is
# published. GitHub's immutable-releases feature rejects asset uploads to an
# already-published release (HTTP 422), so the artifact must be attached while the
# release is still a draft.
#
# Chrome Web Store publishing is opt-in: the step runs only when CWS_CLIENT_ID is
# set, so tag pushes still succeed for clones/forks without publishing credentials.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CWS_EXTENSION_ID    the Web Store item ID (from the item's dashboard URL)
#   CWS_CLIENT_ID       OAuth2 client ID
#   CWS_CLIENT_SECRET   OAuth2 client secret
#   CWS_REFRESH_TOKEN   OAuth2 refresh token
#   CWS_PUBLISHER_ID    Chrome Web Store publisher (developer account) ID
# See https://github.com/fregante/chrome-webstore-upload-keys to mint the tokens.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v3.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Surfaced for the step-level guard below (secrets can't be read in `if:`).
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify tag matches manifest version
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "${tag#v}" != "$manifest_version" ]; then
            echo "::error::Tag $tag does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Create/update release and upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Create the release as a draft if it does not exist yet; uploads must
          # land on a draft (immutable-releases rejects uploads to a published one).
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.zip --clobber
          # Flip to published now that the artifact is attached.
          gh release edit "$tag" --draft=false

      - name: Publish to Chrome Web Store
        if: ${{ env.CWS_CLIENT_ID != '' }}
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          zip="$(ls dist/*.zip)"
          # Bare command uploads the new version and submits it for publication.
          npx --yes chrome-webstore-upload-cli@4.0.1 \
            --source "$zip" \
            --extension-id "$EXTENSION_ID"
